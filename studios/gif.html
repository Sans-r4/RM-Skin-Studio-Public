<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Studio — RM Skin Studio</title>
    <link rel="stylesheet" href="/assets/studio-bridge.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .pattern-checkerboard { 
            background-image: linear-gradient(45deg, #111 25%, transparent 25%), 
                              linear-gradient(-45deg, #111 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #111 75%), 
                              linear-gradient(-45deg, transparent 75%, #111 75%); 
            background-size: 20px 20px; 
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px; 
        }
    </style>
    <script src="/assets/config.js"></script>
</head>
<body class="bg-[#0d1117] text-gray-200 h-screen flex p-6 gap-6 font-sans">

    <!-- PANEL IZQUIERDO (Controles) -->
    <div class="w-1/3 bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-2xl flex flex-col gap-5 overflow-y-auto">
        <h1 class="text-xl font-bold text-sky-400 mb-2">GIF STUDIO</h1>

        <div id="section-file">
            <label class="block text-xs font-semibold text-gray-500 mb-1">1. SELECCIONAR GIF</label>
            <input type="file" id="media-file" accept="image/gif" onchange="processGif()" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:font-semibold file:bg-gray-800 file:text-sky-400 hover:file:bg-gray-700 cursor-pointer bg-gray-950 border border-gray-800 rounded">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">2. NOMBRE DEL PROYECTO</label>
            <input type="text" id="project-name" placeholder="Nombre" class="w-full bg-gray-950 rounded p-2 text-sm border border-gray-800 focus:border-sky-500 focus:outline-none text-white">
        </div>

        <div id="section-fps">
            <label class="block text-xs font-semibold text-gray-500 mb-1">3. VELOCIDAD DE REPRODUCCIÓN (FPS)</label>
            <div class="flex items-center gap-3 bg-gray-950 p-3 rounded border border-gray-800">
                <input type="range" id="fps-slider" min="1" max="60" value="15" class="w-full accent-sky-500" oninput="updateSpeed()">
                <span id="fps-val" class="font-mono text-sky-400 font-bold text-sm w-16 text-right">15 FPS</span>
            </div>
            <p class="text-[10px] text-gray-600 mt-1">Ajusta el control para ver los cambios en tiempo real en la pantalla de la derecha.</p>
        </div>

        <div class="mt-4 ad-slot" style="min-height:180px;border:1px dashed #374151;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:12px;text-align:center;color:#6b7280;font-size:11px;gap:5px">
            <span>Espacio publicitario · Banner</span><small>Solo formato Banner; sin pop-under ni redirecciones automáticas.</small><!-- Inserta aquí el código Banner de Adsterra aprobado. -->
        </div>
        <div class="mt-auto pt-4 border-t border-gray-800">
            <button id="btn-export" onclick="exportWidget()" class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-800 disabled:text-gray-500 text-white font-bold py-3 px-4 rounded transition flex justify-center items-center" disabled>
                Exportar Widget (.zip)
            </button>
        </div>

        <!-- Barra de Progreso -->
        <div id="progress-container" class="hidden">
            <div class="flex justify-between text-[10px] text-gray-400 mb-1 font-mono">
                <span id="progress-status">Procesando fotogramas...</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-gray-950 rounded-full h-1.5 border border-gray-800">
                <div id="progress-bar" class="bg-sky-500 h-1.5 rounded-full transition-all duration-100" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- PANEL DERECHO (Previsualización) -->
    <div class="flex-1 bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-2xl flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-bold text-gray-500">LIVE PREVIEW</h2>
            <div class="text-xs font-mono text-gray-600 bg-gray-950 px-2 py-1 rounded" id="frame-counter">Frames: 0</div>
        </div>
        
        <div class="flex-1 bg-black bg-opacity-50 rounded border border-gray-800 flex items-center justify-center relative overflow-hidden pattern-checkerboard">
            <p id="preview-placeholder" class="text-gray-600 text-sm font-mono absolute">Esperando archivo .gif...</p>
            <img id="live-preview" class="max-w-full max-h-full object-contain hidden" />
        </div>
    </div>

    <script>
        let extractedFrames = [];
        let previewInterval = null;
        let isProcessing = false;
        let currentFrameIndex = 0;

        function updateSpeed() {
            const fps = document.getElementById('fps-slider').value;
            document.getElementById('fps-val').innerText = fps + ' FPS';
            if (extractedFrames.length > 0) {
                startLivePreview();
            }
        }

        function resetPreview() {
            clearInterval(previewInterval);
            extractedFrames = [];
            currentFrameIndex = 0;
            document.getElementById('live-preview').classList.add('hidden');
            document.getElementById('preview-placeholder').classList.remove('hidden');
            document.getElementById('frame-counter').innerText = `Frames: 0`;
            document.getElementById('btn-export').disabled = true;
        }

        async function processGif() {
            const fileInput = document.getElementById('media-file');
            if (!fileInput.files[0]) return;
            if (fileInput.files[0].size > 8 * 1024 * 1024) { alert('El GIF original debe pesar 8 MB o menos.'); fileInput.value=''; return; }
            
            if (!window.ImageDecoder) {
                alert("Tu navegador no soporta el motor nativo ImageDecoder. Por favor usa Google Chrome o Microsoft Edge actualizados.");
                return;
            }

            isProcessing = true;
            resetPreview();
            document.getElementById('preview-placeholder').innerText = "Desempaquetando GIF...";
            updateProgressUI(true, "Procesando fotogramas nativos...");
            
            const file = fileInput.files[0];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            try {
                // Motor nativo: Extrae los frames limpios usando el nucleo de Chromium
                const decoder = new ImageDecoder({ data: file.stream(), type: 'image/gif' });
                await decoder.tracks.ready;
                
                let i = 0;
                let frameBytes = 0;
                let payloadTooLarge = false;
                while (true) {
                    if (i >= 120) break;
                    try {
                        const result = await decoder.decode({ frameIndex: i });
                        
                        if (i === 0) {
                            canvas.width = result.image.displayWidth;
                            canvas.height = result.image.displayHeight;
                        }

                        // Limpiar y dibujar el frame ya procesado con transparencias perfectas
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(result.image, 0, 0);
                        
                        const frameData = canvas.toDataURL('image/png');
                        const approximateBytes = Math.ceil((frameData.length - frameData.indexOf(',') - 1) * 3 / 4);
                        if (frameBytes + approximateBytes > 8 * 1024 * 1024) { payloadTooLarge = true; result.image.close(); break; }
                        extractedFrames.push(frameData); frameBytes += approximateBytes;
                        result.image.close(); 
                        
                        i++;
                        if (i >= 120) break;
                        
                        // Animación de barra de progreso
                        if (i % 3 === 0) {
                            updateProgress(Math.min(99, i * 2));
                            await new Promise(r => setTimeout(r, 0));
                        }
                    } catch (e) {
                        break; // Fin del GIF
                    }
                }

                if (payloadTooLarge) { alert('Los fotogramas PNG superan 8 MB en conjunto. Prueba un GIF más pequeño o con menos fotogramas.'); resetPreview(); document.getElementById('preview-placeholder').innerText='El archivo supera el límite de procesamiento.'; updateProgressUI(false); decoder.close(); isProcessing=false; return; }
                if (i >= 120) { document.getElementById('progress-status').innerText='Límite: se procesaron los primeros 120 fotogramas.'; }
                updateProgressUI(false);
                document.getElementById('frame-counter').innerText = `Frames: ${extractedFrames.length}`;
                document.getElementById('preview-placeholder').classList.add('hidden');
                document.getElementById('live-preview').classList.remove('hidden');
                document.getElementById('btn-export').disabled = false;
                
                startLivePreview();

            } catch (err) {
                console.error(err);
                alert("Hubo un error procesando el GIF. Verifica que el archivo no esté corrupto.");
                updateProgressUI(false);
            }
            
            isProcessing = false;
        }

        function startLivePreview() {
            clearInterval(previewInterval);
            if(extractedFrames.length === 0) return;
            
            const fps = parseInt(document.getElementById('fps-slider').value);
            const intervalTime = Math.floor(1000 / fps);
            const img = document.getElementById('live-preview');

            img.src = extractedFrames[currentFrameIndex];
            
            previewInterval = setInterval(() => {
                currentFrameIndex = (currentFrameIndex + 1) % extractedFrames.length;
                img.src = extractedFrames[currentFrameIndex];
            }, intervalTime);
        }

        function updateProgressUI(show, text = "") {
            const container = document.getElementById('progress-container');
            if (show) {
                container.classList.remove('hidden');
                document.getElementById('progress-status').innerText = text;
                updateProgress(0);
            } else {
                container.classList.add('hidden');
            }
        }

        function updateProgress(pct) {
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('progress-text').innerText = pct + '%';
        }

        function dataURLtoBlob(dataurl) {
            let arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--) u8arr[n] = bstr.charCodeAt(n);
            return new Blob([u8arr], {type:mime});
        }

        window.__RM_GET_STATE = async () => ({
            studio: 'gif', name: document.getElementById('project-name').value.trim() || 'RainmeterGIF',
            config: { projectName: document.getElementById('project-name').value.trim() || 'RainmeterGIF', fps: parseInt(document.getElementById('fps-slider').value) || 15, frames: extractedFrames }
        });
        window.__RM_LOAD_STATE = async (project) => {
            if (!project || project.studio !== 'gif') throw new Error('El proyecto no pertenece a GIF Studio.');
            const config=project.config||{};document.getElementById('project-name').value=project.name||config.projectName||'RainmeterGIF';
            document.getElementById('fps-slider').value=parseInt(config.fps)||15;document.getElementById('fps-val').textContent=(parseInt(config.fps)||15)+' FPS';
            extractedFrames=Array.isArray(config.frames)?config.frames:[];currentFrameIndex=0;
            document.getElementById('frame-counter').textContent=`Frames: ${extractedFrames.length}`;
            if(extractedFrames.length){document.getElementById('live-preview').src=extractedFrames[0];document.getElementById('live-preview').classList.remove('hidden');document.getElementById('preview-placeholder').classList.add('hidden');document.getElementById('btn-export').disabled=false;startLivePreview();}
            else resetPreview();
        };
        async function exportWidget() {
            if (extractedFrames.length === 0) return;
            const btn=document.getElementById('btn-export');btn.disabled=true;
            try { await window.RMStudioBridge.export(await window.__RM_GET_STATE()); }
            catch (e) { window.RMStudioBridge?.notice(e.message || 'No se pudo exportar el ZIP.'); }
            finally { btn.disabled=false; }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="/assets/firebase-auth.js"></script><script src="/assets/studio-bridge.js"></script>
</body>
</html>
